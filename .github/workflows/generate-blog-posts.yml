name: Generate Blog Posts

on:
  schedule:
    # Запуск двічі на тиждень: понеділок та четвер о 10:00 UTC (12:00 Київ)
    - cron: '0 10 * * 1,4'
  workflow_dispatch: # Дозволяє запускати вручну

jobs:
  generate-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx ts-node scripts/generate-blog-post.ts
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/blog/
          git add app/sitemap.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Автоматична генерація нової блог-статті"
            git push
          fi
      
      - name: Trigger Vercel deployment
        run: |
          echo "✅ Зміни відправлено в GitHub. Vercel автоматично задеплоїть оновлення."
